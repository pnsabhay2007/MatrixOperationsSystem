<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Matrix Operations System</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; z-index: 1; }
  .landing {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
    cursor: pointer;
    user-select: none;
  }
  .bracket {
    font-size: 5rem;
    font-weight: 300;
    color: #eafff0;
    text-shadow: 0 0 18px rgba(140,255,170,0.6);
    transition: transform 0.3s ease;
  }
  .brand:hover .bracket.left { transform: translateX(-8px); }
  .brand:hover .bracket.right { transform: translateX(8px); }
  .title {
    font-size: 4.5rem;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 0 25px rgba(80, 255, 140, 0.55);
    letter-spacing: 2px;
    transition: text-shadow 0.3s ease;
  }
  .brand:hover .title { text-shadow: 0 0 40px rgba(80, 255, 140, 0.9); }
  .subtitle {
    margin-top: 22px;
    color: #8fdba0;
    font-size: 1.05rem;
    opacity: 0.85;
    letter-spacing: 1px;
  }
  .enter-hint {
    margin-top: 40px;
    color: #6fbf80;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.7;
    animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
</style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="landing">
    <a href="app.html" class="brand" style="text-decoration:none;">
      <span class="bracket left">[</span>
      <span class="title">MATRIX</span>
      <span class="bracket right">]</span>
    </a>
    <div class="subtitle">C++ Engine &middot; Web Interface &middot; Real-Time Matrix Computation</div>
    <div class="enter-hint">Click to Enter</div>
  </div>
  <script src="rain.js"></script>
</body>
</html>
